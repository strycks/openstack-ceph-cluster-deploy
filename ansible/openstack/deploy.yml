- name: Deploy OpenStack with kolla-ansible
  hosts: openstack_admin
  gather_facts: true
  become: false
  vars:
    kolla_home: "/home/{{ ansible_user }}"
  tasks:
    - name: Bootstrap servers
      ansible.builtin.shell:
        cmd: ". {{ kolla_home }}/kolla-venv/bin/activate && kolla-ansible bootstrap-servers -i /etc/kolla/all-in-one 2>&1 | tee /tmp/kolla-bootstrap.log"
      register: bootstrap

    - name: Show bootstrap output (tail)
      ansible.builtin.debug:
        msg: "{{ bootstrap.stdout_lines[-20:] | join('\n') }}"
      when: bootstrap.stdout != ""

    - name: Run prechecks
      ansible.builtin.shell:
        cmd: ". {{ kolla_home }}/kolla-venv/bin/activate && kolla-ansible prechecks -i /etc/kolla/all-in-one --use-test-images 2>&1 | tee /tmp/kolla-precheck.log"
      register: prechecks

    - name: Show prechecks output (tail)
      ansible.builtin.debug:
        msg: "{{ prechecks.stdout_lines[-20:] | join('\n') }}"
      when: prechecks.stdout != ""

    # Heartbeat every 5 seconds, output streamed to /tmp/kolla-deploy.log
    - name: Deploy OpenStack
      ansible.builtin.shell:
        cmd: ". {{ kolla_home }}/kolla-venv/bin/activate && kolla-ansible deploy -i /etc/kolla/all-in-one 2>&1 | tee /tmp/kolla-deploy.log"
      async: 3600
      poll: 5
      register: deploy_result

    - name: Show deploy output (tail)
      ansible.builtin.debug:
        msg: "{{ deploy_result.stdout_lines[-20:] | join('\n') }}"
      when: deploy_result.stdout != ""
