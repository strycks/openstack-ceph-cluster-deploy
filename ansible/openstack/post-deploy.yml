- name: Post-deploy OpenStack with kolla-ansible
  hosts: openstack_admin
  gather_facts: true
  become: false
  vars:
    kolla_home: "/home/{{ ansible_user }}"
  tasks:
    - name: Run kolla-ansible post-deploy
      ansible.builtin.shell:
        cmd: >-
          . {{ kolla_home }}/kolla-venv/bin/activate &&
          kolla-ansible post-deploy -i /etc/kolla/all-in-one 2>&1 | tee /tmp/kolla-post-deploy.log
      register: post_deploy

    - name: Show post-deploy output (tail)
      ansible.builtin.debug:
        msg: "{{ post_deploy.stdout_lines[-20:] | join('\n') }}"
      when: post_deploy.stdout != ""

    - name: Create the OpenStack client configuration directory
      become: true
      ansible.builtin.file:
        path: /etc/openstack
        state: directory
        mode: "0755"

    - name: Copy clouds.yaml for the OpenStack client
      become: true
      ansible.builtin.copy:
        src: /etc/kolla/clouds.yaml
        dest: /etc/openstack/clouds.yaml
        remote_src: true
        owner: root
        group: ubuntu
        mode: "0640"

    - name: Install OpenStack client
      become: true
      ansible.builtin.apt:
        name: python3-openstackclient
        state: present
        update_cache: true
