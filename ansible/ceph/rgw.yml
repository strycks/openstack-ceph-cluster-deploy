---
- name: Create RGW pools and configure zone placement
  hosts: ceph_admin
  become: true
  gather_facts: false
  environment:
    CEPH_CONTAINER_IMAGE: "{{ ceph_container_image }}"
    CEPH_CONTAINER_BINARY: "{{ ceph_container_binary }}"
  tasks:
    - name: Create rgw-data-standard erasure-coded pool
      ceph.automation.ceph_pool:
        name: rgw-data-standard
        pool_type: erasure
        rule_name: ssd-ec42
        erasure_profile: ssd-ec42
        pg_autoscale_mode: "on"
        application: rgw

    - name: Check EC overwrites on the STANDARD data pool
      ansible.builtin.command:
        cmd: >
          cephadm shell -- ceph osd pool get
          rgw-data-standard allow_ec_overwrites --format=json
      register: rgw_standard_ec_overwrites
      changed_when: false

    # ceph.automation 1.2.0 does not expose allow_ec_overwrites.
    - name: Enable EC overwrites on the STANDARD data pool
      ansible.builtin.command:
        cmd: >
          cephadm shell -- ceph osd pool set
          rgw-data-standard allow_ec_overwrites true
      when: not ((rgw_standard_ec_overwrites.stdout | from_json).allow_ec_overwrites | bool)
      changed_when: true

    - name: Create rgw-data-standard-ia erasure-coded pool
      ceph.automation.ceph_pool:
        name: rgw-data-standard-ia
        pool_type: erasure
        rule_name: hdd-ec42
        erasure_profile: hdd-ec42
        pg_autoscale_mode: "on"
        application: rgw

    - name: Check EC overwrites on the STANDARD_IA data pool
      ansible.builtin.command:
        cmd: >
          cephadm shell -- ceph osd pool get
          rgw-data-standard-ia allow_ec_overwrites --format=json
      register: rgw_standard_ia_ec_overwrites
      changed_when: false

    - name: Enable EC overwrites on the STANDARD_IA data pool
      ansible.builtin.command:
        cmd: >
          cephadm shell -- ceph osd pool set
          rgw-data-standard-ia allow_ec_overwrites true
      when: not ((rgw_standard_ia_ec_overwrites.stdout | from_json).allow_ec_overwrites | bool)
      changed_when: true

    - name: Create rgw-data-glacier-ir erasure-coded pool
      ceph.automation.ceph_pool:
        name: rgw-data-glacier-ir
        pool_type: erasure
        rule_name: hdd-ec83
        erasure_profile: hdd-ec83
        pg_autoscale_mode: "on"
        application: rgw

    - name: Check EC overwrites on the GLACIER_IR data pool
      ansible.builtin.command:
        cmd: >
          cephadm shell -- ceph osd pool get
          rgw-data-glacier-ir allow_ec_overwrites --format=json
      register: rgw_glacier_ir_ec_overwrites
      changed_when: false

    - name: Enable EC overwrites on the GLACIER_IR data pool
      ansible.builtin.command:
        cmd: >
          cephadm shell -- ceph osd pool set
          rgw-data-glacier-ir allow_ec_overwrites true
      when: not ((rgw_glacier_ir_ec_overwrites.stdout | from_json).allow_ec_overwrites | bool)
      changed_when: true

    - name: Create rgw-metadata pool
      ceph.automation.ceph_pool:
        name: rgw-metadata
        pool_type: replicated
        size: "3"
        rule_name: replicated_ssd
        application: rgw

    - name: Create rgw-index pool
      ceph.automation.ceph_pool:
        name: rgw-index
        pool_type: replicated
        size: "3"
        rule_name: replicated_ssd
        application: rgw

    - name: Create default realm
      ceph.automation.radosgw_realm:
        name: default
        default: true
      register: rgw_realm_result

    - name: Set realm on zonegroup
      ceph.automation.radosgw_zonegroup:
        name: default
        realm: default
        endpoints:
          - "http://10.10.2.250:80"
        default: true
        master: true
      register: rgw_zonegroup_result

    - name: Set realm and zonegroup on zone
      ceph.automation.radosgw_zone:
        name: default
        realm: default
        zonegroup: default
        endpoints:
          - "http://10.10.2.250:80"
        default: true
        master: true
      register: rgw_zone_result

    - name: Commit period after creating the master zone
      ansible.builtin.command:
        cmd: cephadm shell -- radosgw-admin period update --commit
      when: >-
        rgw_realm_result is changed
        or rgw_zonegroup_result is changed
        or rgw_zone_result is changed
      changed_when: true

    - name: Get current zonegroup config
      ansible.builtin.command:
        cmd: >
          cephadm shell -- radosgw-admin zonegroup get
          --rgw-realm=default --rgw-zonegroup=default --format=json
      register: zonegroup_raw
      changed_when: false

    - name: Read storage classes from default placement target
      ansible.builtin.set_fact:
        zonegroup_storage_classes: >-
          {{
            (
              (zonegroup_raw.stdout | from_json).placement_targets
              | selectattr('name', 'equalto', 'default-placement')
              | map(attribute='storage_classes')
              | first
            ) | default(['STANDARD'], true)
          }}

    - name: Add storage classes to the default zonegroup placement
      ansible.builtin.command:
        cmd: >
          cephadm shell -- radosgw-admin zonegroup placement add
          --rgw-zonegroup=default --placement-id=default-placement
          --storage-class={{ item }}
      loop:
        - STANDARD_IA
        - GLACIER_IR
      when: item not in zonegroup_storage_classes
      register: zonegroup_storage_class_update
      changed_when: true

    - name: Get current zone config
      ansible.builtin.command:
        cmd: >
          cephadm shell -- radosgw-admin zone get
          --rgw-realm=default --rgw-zonegroup=default --rgw-zone=default
          --format=json
      register: zone_raw
      changed_when: false

    - name: Read current default placement config
      ansible.builtin.set_fact:
        current_default_placement: >-
          {{
            (
              (zone_raw.stdout | from_json).get('placement_pools', [])
              | selectattr('key', 'equalto', 'default-placement')
              | first
            ) | default({'key': 'default-placement', 'val': {}}, true)
          }}

    - name: Build desired default placement config
      ansible.builtin.set_fact:
        desired_default_placement:
          key: default-placement
          val: >-
            {{
              current_default_placement.val | combine({
                'index_pool': 'rgw-index',
                'data_extra_pool': 'rgw-metadata',
                'storage_classes': {
                  'STANDARD': {
                    'data_pool': 'rgw-data-standard'
                  },
                  'STANDARD_IA': {
                    'data_pool': 'rgw-data-standard-ia',
                    'compression_type': 'zstd'
                  },
                  'GLACIER_IR': {
                    'data_pool': 'rgw-data-glacier-ir',
                    'compression_type': 'zstd'
                  }
                },
                'index_type': 0,
                'inline_data': true
              }, recursive=True)
            }}

    - name: Build updated zone doc with custom storage classes
      ansible.builtin.set_fact:
        zone_doc: >-
          {{
            (zone_raw.stdout | from_json) | combine({
              'placement_pools': (
                (zone_raw.stdout | from_json).get('placement_pools', [])
                | rejectattr('key', 'equalto', 'default-placement')
                | list
              ) + [desired_default_placement]
            })
          }}

    - name: Apply zone config with custom storage classes
      ceph.automation.radosgw_zone:
        name: default
        realm: default
        zonegroup: default
        state: set
        zone_doc: "{{ zone_doc }}"
      when: zone_doc != (zone_raw.stdout | from_json)
      register: zone_config_update

    - name: Commit period update
      ansible.builtin.command:
        cmd: cephadm shell -- radosgw-admin period update --commit
      when: >-
        zonegroup_storage_class_update is changed
        or zone_config_update is changed
      changed_when: true

    - name: Apply RGW service
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: rgw
          service_id: myrgw
          placement:
            label: "rgw"
          spec:
            rgw_frontend_port: 8080
    - name: Apply RGW ingress
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: ingress
          service_id: rgw.myrgw
          placement:
            label: "rgw"
          spec:
            backend_service: rgw.myrgw
            virtual_ip: 10.10.2.250/24
            frontend_port: 80
            monitor_port: 1967
            virtual_interface_networks:
              - 10.10.2.0/24
