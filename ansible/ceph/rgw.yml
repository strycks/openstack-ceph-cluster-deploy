- name: Create RGW pools and configure zone placement
  hosts: ceph_admin
  become: true
  gather_facts: false
  tasks:
    - name: Create rgw-data-standard erasure-coded pool
      ceph.automation.ceph_pool:
        name: rgw-data-standard
        pool_type: erasure
        rule_name: ssd-ec42
        erasure_profile: ssd-ec42
        pg_autoscale_mode: auto
        application: rgw

    # We don't have ec overwrites option in any module of ceph.automation yet
    - name: Enable EC overwrites on the RGW data pool
      ansible.builtin.command:
        cmd: cephadm shell -- ceph osd pool set rgw-data-standard allow_ec_overwrites true

    - name: Create rgw-data-standard-ia erasure-coded pool
      ceph.automation.ceph_pool:
        name: rgw-data-standard-ia
        pool_type: erasure
        rule_name: hdd-ec42
        erasure_profile: hdd-ec42
        pg_autoscale_mode: auto
        application: rgw

    - name: Enable EC overwrites on the RGW data pool
      ansible.builtin.command:
        cmd: cephadm shell -- ceph osd pool set rgw-data-standard-ia allow_ec_overwrites true

    - name: Create rgw-data-glacier-ir erasure-coded pool
      ceph.automation.ceph_pool:
        name: rgw-data-glacier-ir
        pool_type: erasure
        rule_name: hdd-ec83
        erasure_profile: hdd-ec83
        pg_autoscale_mode: auto
        application: rgw

    - name: Enable EC overwrites on the RGW data pool
      ansible.builtin.command:
        cmd: cephadm shell -- ceph osd pool set rgw-data-glacier-ir allow_ec_overwrites true

    - name: Create rgw-metadata pool
      ceph.automation.ceph_pool:
        name: rgw-metadata
        pool_type: replicated
        size: "3"
        rule_name: replicated_ssd
        application: rgw

    - name: Create rgw-index pool
      ceph.automation.ceph_pool:
        name: rgw-index
        pool_type: replicated
        size: "3"
        rule_name: replicated_ssd
        application: rgw

    - name: Create default realm
      ceph.automation.radosgw_realm:
        name: default
        default: true

    - name: Set realm on zonegroup
      ceph.automation.radosgw_zonegroup:
        name: default
        realm: default
        endpoints:
          - "http://10.10.2.250:80"
        default: true
        master: true

    - name: Set realm and zonegroup on zone
      ceph.automation.radosgw_zone:
        name: default
        realm: default
        zonegroup: default
        endpoints:
          - "http://10.10.2.250:80"
        default: true
        master: true

    - name: Commit period after creating the master zone
      ansible.builtin.command:
        cmd: cephadm shell -- radosgw-admin period update --commit
      changed_when: true

    - name: Get current zone config
      ansible.builtin.command:
        cmd: >
          cephadm shell -- radosgw-admin zone get
          --rgw-realm=default --rgw-zonegroup=default --rgw-zone=default
          --format=json
      register: zone_raw
      changed_when: false

    - name: Build updated zone doc with custom pools
      ansible.builtin.set_fact:
        zone_doc: |
          {{
            (zone_raw.stdout | from_json) | combine({
              'placement_pools': [{
                'key': 'default-placement',
                'val': {
                  'index_pool': 'rgw-index',
                  'data_extra_pool': 'rgw-metadata',
                  'storage_classes': {
                    'STANDARD': { 'data_pool': 'rgw-data-standard' },
                    'STANDARD_IA': { 'data_pool': 'rgw-data-standard-ia', 'compression_type': 'zstd' },
                    'GLACIER_IR': { 'data_pool': 'rgw-data-glacier-ir', 'compression_type': 'zstd' }
                  },
                  'index_type': 0,
                  'inline_data': true
                }
              }]
            }, recursive=True)
          }}

    - name: Apply zone config with custom storage classes
      ceph.automation.radosgw_zone:
        name: default
        realm: default
        zonegroup: default
        state: set
        zone_doc: "{{ zone_doc }}"

    - name: Commit period update
      ansible.builtin.command:
        cmd: cephadm shell -- radosgw-admin period update --commit
      changed_when: true

    - name: Apply RGW service
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: rgw
          service_id: myrgw
          placement:
            label: "rgw"
          spec:
            rgw_frontend_port: 8080
    - name: Apply RGW ingress
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: ingress
          service_id: rgw.myrgw
          placement:
            label: "rgw"
          spec:
            backend_service: rgw.myrgw
            virtual_ip: 10.10.2.250/24
            frontend_port: 80
            monitor_port: 1967
            virtual_interface_networks:
              - 10.10.2.0/24
