- name: Ceph preflight
  hosts: ceph
  become: true
  gather_facts: true
  tasks:
    - name: Install prerequisites
      apt:
        name: [cephadm, chrony, ceph-common]
        state: present
        update_cache: true
    - name: Ensure chrony is running
      service:
        name: chrony
        state: started
        enabled: true
