- name: Bootstrap Ceph cluster
  hosts: ceph_admin
  become: true
  gather_facts: true
  tasks:
    - name: Run cephadm bootstrap
      ceph.automation.cephadm_bootstrap:
        mon_ip: "{{ public_ip }}"
        cluster_network: "{{ net_ceph_cluster }}"
      register: bootstrap_result
    - name: Show bootstrap result
      debug:
        var: bootstrap_result
    - name: Fetch cluster's pubkey
      slurp:
        src: /etc/ceph/ceph.pub
      register: ceph_pub_key
- name: Distribute SSH key pair
  hosts: ceph
  become: true
  tasks:
    - name: Add cluster public key to authorized_key of all nodes
      authorized_key:
        user: root
        state: present
        key: "{{ hostvars[groups['ceph_admin'][0]]['ceph_pub_key']['content'] | b64decode }}"
- name: Add hosts to cluster
  hosts: ceph_admin
  become: true
  tasks:
    - name: Add hosts to cluster
      ceph.automation.ceph_orch_host:
        name: "{{ item }}"
        address: "{{ hostvars[item].public_ip }}"
        labels: "{{ hostvars[item].labels | from_yaml }}"
        state: present
      loop: "{{ groups['ceph'] }}"
