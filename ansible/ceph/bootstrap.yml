- name: Bootstrap Ceph cluster
  hosts: ceph_admin
  become: true
  gather_facts: true
  tasks:
    - name: Check whether this host is already bootstrapped. This is a temporary fix, because cephadm_bootstrap is not idempotent!
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: ceph_conf_stat
    - name: Run cephadm bootstrap
      ceph.automation.cephadm_bootstrap:
        mon_ip: "{{ public_ip }}"
        cluster_network: "{{ net_ceph_cluster }}"
      when: not ceph_conf_stat.stat.exists
      register: bootstrap_result
    - name: Show bootstrap result
      debug:
        var: bootstrap_result
    - name: Fetch cluster's pubkey
      slurp:
        src: /etc/ceph/ceph.pub
      register: ceph_pub_key
- name: Distribute SSH key pair
  hosts: ceph
  become: true
  tasks:
    - name: Add cluster public key to authorized_key of all nodes
      authorized_key:
        user: root
        state: present
        key: "{{ hostvars[groups['ceph_admin'][0]]['ceph_pub_key']['content'] | b64decode }}"
- name: Add hosts to cluster
  hosts: ceph_admin
  become: true
  tasks:
    - name: Add hosts to cluster
      ceph.automation.ceph_orch_host:
        name: "{{ item }}"
        address: "{{ hostvars[item].public_ip }}"
        labels: "{{ hostvars[item].labels | from_yaml }}"
        state: present
      loop: "{{ groups['ceph'] }}"

- name: Deploy core services
  hosts: ceph_admin
  become: true
  gather_facts: false
  tasks:
    - name: Apply mon services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: mon
          service_name: mon
          placement:
            label: "mon"
    - name: Apply mgr services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: mgr
          service_name: mgr
          placement:
            label: "mgr"
    - name: Apply tier-small-hdd osd services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: osd
          service_id: tier-small-hdd
          unmanaged: false
          placement:
            label: "osd"
          spec:
            data_devices:
              size: "50GB"
              rotational: 1
            db_devices:
              size: "5GB"
              rotational: 0
            block_db_size: "2GB"
    - name: Apply tier-large-hdd osd services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: osd
          service_id: tier-large-hdd
          unmanaged: false
          placement:
            label: "osd"
          spec:
            data_devices:
              size: "75GB"
              rotational: 1
            db_devices:
              size: "5GB"
              rotational: 0
            block_db_size: "2.9GB"
    - name: Apply tier-ssd osd services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: osd
          service_id: tier-ssd
          unmanaged: false
          placement:
            label: "osd"
          spec:
            data_devices:
              size: "25GB"
              rotational: 0
