- name: Apply essential services
  hosts: ceph_admin
  become: true
  gather_facts: false
  tasks:
    - name: Apply mon services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: mon
          service_name: mon
          placement:
            label: "mon"
    - name: Apply mgr services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: mgr
          service_name: mgr
          placement:
            label: "mgr"
    - name: Apply tier-hdd osd services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: osd
          service_id: tier-hdd
          unmanaged: false
          placement:
            label: "osd"
          spec:
            data_devices:
              rotational: 1
            db_devices:
              size: "5GB"
              rotational: 0
            block_db_size: "4.9GB"
    - name: Apply tier-ssd osd services
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: osd
          service_id: tier-ssd
          unmanaged: false
          placement:
            label: "osd"
          spec:
            data_devices:
              size: "10GB"
              rotational: 0
    - name: Apply RGW service
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: rgw
          service_id: myrgw
          placement:
            label: "rgw"
    - name: Apply RGW ingress
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: ingress
          service_id: rgw.myrgw
          placement:
            label: "rgw"
          spec:
            backend_service: rgw.myrgw
            virtual_ip: 10.10.2.250/24
            frontend_port: 80
            monitor_port: 1967
            virtual_interface_networks:
              - 10.10.2.0/24
    - name: Apply CephFS MDS service
      ceph.automation.ceph_orch_apply:
        spec: |
          service_type: mds
          service_id: mycephfs
          placement:
            label: "mds"
